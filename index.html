<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPCR 蛋白靶点目录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F4F0;
    --bg-raised: #FBFCFA;
    --ink: #12201B;
    --ink-soft: #4C5C54;
    --line: #D3DBD2;
    --teal: #0E7C63;
    --teal-deep: #0A5D4A;
    --amber: #B8843C;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }

  /* ===== Filter bar ===== */
  .toolbar{
    background: var(--bg);
    padding: 20px 48px;
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    gap: 16px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .search-wrap{
    flex: 1;
    min-width: 0;
    max-width: 420px;
    position: relative;
  }
  .search-wrap input{
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--ink);
  }
  .search-wrap input:focus{
    outline: none;
    border-color: var(--teal);
  }
  .search-wrap svg{
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
  }
  .result-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ===== Table ===== */
  .table-wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 48px 80px;
  }
  .table-scroll{
  }
  table{
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
  }
  thead th{
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 12px 16px;
    border-bottom: 1px solid var(--ink);
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th:hover{ color: var(--teal-deep); }
  thead th .arrow{ font-size: 10px; margin-left: 4px; opacity: 0.5; }
  tbody tr{
    border-bottom: 1px solid var(--line);
  }
  tbody tr:hover{ background: var(--bg-raised); }
  td{
    padding: 11px 16px;
    font-size: 14px;
    vertical-align: top;
  }
  td.uniprot{
    font-family: 'IBM Plex Mono', monospace;
    color: var(--teal-deep);
    font-size: 13px;
    white-space: nowrap;
  }
  td.entry{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 13.5px;
    white-space: nowrap;
  }
  td.genes{
    color: var(--ink-soft);
    font-size: 13.5px;
    white-space: nowrap;
  }
  .tag-chip{
    display: inline-block;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--amber);
    border: 1px solid #E3CFA4;
    background: #FBF4E7;
    padding: 3px 9px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .empty-state{
    padding: 60px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    display: none;
  }

  footer{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 48px 48px;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 760px){
    .toolbar{ padding: 14px 16px; gap: 10px; }
    .search-wrap{ max-width: none; }
    .search-wrap input{ font-size: 13px; padding: 9px 12px 9px 34px; }
    .result-count{ font-size: 11px; }
    .table-wrap{ padding: 0 0 60px; }
    td, thead th{ padding: 9px 10px; font-size: 12.5px; }
    thead th{ white-space: normal; }
    td.genes{ white-space: normal; }
    td.tag{ white-space: normal; }
    .tag-chip{ white-space: normal; }
  }
</style>
</head>

<div class="toolbar" id="toolbar">

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

</div>

<div class="table-wrap">

</div>

let sortKey = null;
let sortAsc = true;

function render(rows){
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  document.getElementById('count').textContent = rows.length + ' 条记录';
  if(rows.length === 0){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="uniprot">${r.uniprot}</td>
      <td class="entry">${r.entry}</td>
      <td class="genes">${r.genes || '—'}</td>
      <td><span class="tag-chip">${r.tag}</span></td>
    </tr>
  `).join('');
}

function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = DATA.filter(r => {
    if(!q) return true;
    return r.uniprot.toLowerCase().includes(q)
        || r.entry.toLowerCase().includes(q)
        || (r.genes || '').toLowerCase().includes(q);
  });
  if(sortKey){
    rows = [...rows].sort((a,b) => {
      const av = (a[sortKey]||'').toLowerCase();
      const bv = (b[sortKey]||'').toLowerCase();
      if(av < bv) return sortAsc ? -1 : 1;
      if(av > bv) return sortAsc ? 1 : -1;
      return 0;
    });
  }
  render(rows);
}

document.getElementById('search').addEventListener('input', applyFilters);

document.querySelectorAll('thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.getAttribute('data-key');
    if(sortKey === key){ sortAsc = !sortAsc; } else { sortKey = key; sortAsc = true; }
    applyFilters();
  });
});

applyFilters();
